name: Build DMC Studio APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        id: unpack
        run: |
          if [ -f dmc-studio-android.zip ]; then unzip -o -q dmc-studio-android.zip -d . ; fi
          if [ -f settings.gradle ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "Upload dmc-studio-android.zip to build the app."; fi
      - uses: actions/setup-java@v4
        if: steps.unpack.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.unpack.outputs.ready == 'true'
        with:
          gradle-version: '8.7'
      - name: Prepare app page for offline use
        if: steps.unpack.outputs.ready == 'true'
        run: python3 tools/prepare_web.py
      - name: Build APK
        if: steps.unpack.outputs.ready == 'true'
        run: |
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/DMC-Studio-1.${{ github.run_number }}.apk"
      - name: Publish APK
        if: steps.unpack.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: DMC Studio 1.${{ github.run_number }}
          files: out/*.apk
